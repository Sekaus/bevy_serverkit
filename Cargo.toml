[package]
name = "bevy_serverkit"
version = "0.1.0"
edition = "2024"
autoexamples = false

[[example]]
name = "player_database"
path = "examples/player_database.rs"

[[example]]
name = "player_live_update"
path = "examples/player_live_update.rs"

[dependencies]
bevy = "0.18.1"
bincode = "1.3.3"
postgres = { version = "0.19.13", features = ["with-serde_json-1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
